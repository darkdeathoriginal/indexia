name: Release Build Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: indexia-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: indexia-linux-arm64
          - goos: windows
            goarch: amd64
            output_name: indexia-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output_name: indexia-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            output_name: indexia-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: indexia-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.output_name }} main.go

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  create_release:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Prepare Release Binaries
        run: |
          mkdir -p release-binaries
          find dist-all -type f -exec cp {} release-binaries/ \;
          ls -la release-binaries/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-binaries/*
          draft: false
          prerelease: false
          generate_release_notes: true
